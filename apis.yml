aid: lumin-digital
name: Lumin Digital
description: >-
  Lumin Digital is a cloud-native digital banking platform for credit unions and community banks,
  founded in 2016 by Jeff Chambers and headquartered in San Ramon, California. The platform is built
  on a single-tenant, microservices architecture and sits on top of an institution's existing core
  banking processor, delivering retail banking, commercial banking, digital account opening, user
  engagement, risk management, digital marketing and data analytics as modules. Its extensibility
  layer is API- and SDK-based: Lumin publishes a client SDK and a partner API programme that connects
  the platform to a stated 200+ third-party fintech solutions, and a developer portal used by
  financial institutions and integration partners to move data into and out of digital banking. The
  API reference, SDK downloads and developer portal are reachable only through the authenticated
  client portal at clients.lumindigital.com, so no machine-readable contract is published publicly.
