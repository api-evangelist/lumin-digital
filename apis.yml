apis:
- aid: lumin-digital-platform
  name: Lumin Digital Platform APIs
  description: >-
    Lumin Digital's platform API and SDK surface, used by financial institutions and by ecosystem
    partners to integrate third-party products into the digital banking experience and to move data
    between the platform, the core processor and third parties. Marketed publicly on the
    extensibility and ecosystem pages; the reference, spec and SDK artifacts are distributed through
    the authenticated client portal, and the platform is deployed single-tenant per institution so
    no single public base URL is published.
  humanURL: https://lumindigital.com/extensibility/
  x-base-url-finding: >-
    repair-api-bases.py verdict `missing` (2026-08-25). Left missing deliberately rather than guessed.
    Lumin Digital documents no API base URL anywhere public — the platform is deployed single-tenant
    per financial institution, so each client's host differs, and the reference that would name it is
    behind https://clients.lumindigital.com/login. api.demo.lumindigital.com resolves and terminates
    TLS but is the demo tenant's app host, answers 404 at root and on every spec path, and is not
    documented as an API base; recording it as baseURL would assert a contract that was never
    published.
  tags:
  - Digital Banking
  - Extensibility
  - Partner Integration
