  Lumin Digital publishes ONE first-party package to a public registry, and it is not a client
  library for the digital banking platform. @lumindigital/juno is an internal-tooling CLI that
  generates Argo Workflows from TypeScript; its own README states it is "un-official" with respect to
  the Argo project. It is recorded here because it is genuinely first-party (published under the
  company's own npm scope, source in github.com/lumindigital), and because its release cadence is the
  only publicly-dated engineering signal the company emits. NO official SDK for the Lumin Digital
  platform API is published to any public registry: the platform SDK is distributed to financial
  institutions and ecosystem partners under the SDK licence agreement at
  https://lumindigital.com/software-development-kit-license-agreement/ through the authenticated
  client portal, so it has no registry metadata endpoint to read. Because no public client library
  exists, NO `SDKs` pointer is emitted in apis.yml — a `Packages` pointer only.
